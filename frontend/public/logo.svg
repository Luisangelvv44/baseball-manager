    </clipPath>
    <path id="bat" d="M -1.5 19 L -1.5 5 Q -1.5 -2 -3.4 -8 L -3.4 -17 Q -3.4 -20 0 -20 Q 3.4 -20 3.4 -17 L 3.4 -8 Q 1.5 -2 1.5 5 L 1.5 19 Z" />
