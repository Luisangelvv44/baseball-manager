  <g clip-path="url(#ball)" fill="none" stroke="#c8102e" stroke-linecap="round">
    <path d="M24.5 20.5 Q29.5 31 24.5 41.5" stroke-width="1.3" />
    <path d="M39.5 20.5 Q34.5 31 39.5 41.5" stroke-width="1.3" />
    <path d="M24.5 20.5 Q29.5 31 24.5 41.5" stroke-width="3.4" stroke-dasharray="0.9 1.9" stroke-linecap="butt" />
    <path d="M39.5 20.5 Q34.5 31 39.5 41.5" stroke-width="3.4" stroke-dasharray="0.9 1.9" stroke-linecap="butt" />
